name: Upstream Metadata Regression

on:
  workflow_dispatch:
    inputs:
      all_platforms:
        description: Also run the read-only upstream samples on macOS and Windows
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '19 3 * * 0'

permissions:
  contents: read

concurrency:
  group: upstream-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Public metadata samples (${{ matrix.label }})
    if: >-
      (github.event_name == 'schedule' && matrix.os == 'ubuntu-24.04') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.all_platforms || matrix.os == 'ubuntu-24.04'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - label: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI for this platform
        env:
          CCL_BUILD_CHANNEL: ${{ github.ref_name == 'main' && 'stable' || 'dev' }}
          CCL_BUILD_COMMIT: ${{ github.sha }}
          CCL_BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p ccl-cli
      - name: Probe fixed public samples
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/ccl"
          python=python3
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="$binary.exe"
            python=python
          fi
          "$python" scripts/upstream-regression.py --binary "$binary" --output upstream-report/report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: upstream-${{ matrix.target }}
          path: upstream-report/report.json
          if-no-files-found: warn
          retention-days: 90
