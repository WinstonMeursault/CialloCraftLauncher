name: GUI Prototype

on:
  push:
    branches: ['codex/gui-*']
  pull_request:
    paths: ['apps/ccl-gui/**', 'crates/ccl-gui/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/gui.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows x64, os: windows-2025 }
          - { label: macOS arm64, os: macos-15 }
          - { label: Linux x86_64, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frontend package manager
        run: npm install --global pnpm@11.25.0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - name: Install Linux WebView development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/ccl-gui
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        working-directory: apps/ccl-gui
        run: |
          pnpm test
          pnpm build
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test adapter without desktop runtime
        run: cargo test -p ccl-gui --locked
      - name: Lint desktop
        run: cargo clippy -p ccl-gui --features desktop --all-targets --locked -- -D warnings
      - name: Build desktop prototype
        run: cargo build -p ccl-gui --features desktop --release --locked
