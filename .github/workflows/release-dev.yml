name: Developer Build Release

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: developer-release
  cancel-in-progress: false

jobs:
  validate-package:
    name: Validate and package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - label: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - label: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install frontend package manager
        run: npm install --global pnpm@11.25.0
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.4
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb libfuse2t64
      - name: Install frontend dependencies
        working-directory: apps/ccl-gui
        run: pnpm install --frozen-lockfile
      - name: Build GUI frontend
        working-directory: apps/ccl-gui
        run: pnpm build
      - name: Confirm tested commit is the current dev tip
        shell: bash
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
      - name: Validate source
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
          cargo test --workspace --all-targets --locked --target ${{ matrix.target }}
      - name: Verify Windows credential vault
        if: runner.os == 'Windows'
        run: cargo test -p ccl-core --lib --locked --target ${{ matrix.target }} os_secure_store_probe_round_trips_without_account_credentials -- --ignored
      - name: Verify Windows provider key vault
        if: runner.os == 'Windows'
        run: cargo test -p ccl-core --lib --locked --target ${{ matrix.target }} provider_key_vault_round_trip_never_uses_a_config_file -- --ignored
      - name: Set package version
        id: identity
        shell: bash
        run: |
          version="$(python3 scripts/check-package-versions.py --cli-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build release executable
        env:
          CCL_BUILD_CHANNEL: dev
          CCL_BUILD_COMMIT: ${{ github.sha }}
          CCL_BUILD_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p ccl-cli
      - name: Generate bundled GUI notices
        run: |
          cargo fetch --locked --target ${{ matrix.target }}
          python3 scripts/gui-notices.py --target ${{ matrix.target }}
      - name: Build GUI installers
        working-directory: crates/ccl-gui
        env:
          CCL_BUILD_CHANNEL: dev
          CCL_BUILD_COMMIT: ${{ github.sha }}
          CCL_BUILD_TARGET: ${{ matrix.target }}
        run: tauri build --features desktop --target ${{ matrix.target }}
      - name: Verify rendered GUI readiness on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 WEBKIT_DISABLE_COMPOSITING_MODE=1 python3 scripts/gui-smoke.py --executable target/${{ matrix.target }}/release/ccl-gui --output dist/gui-smoke-${{ matrix.target }}.json
      - name: Verify rendered GUI readiness on Windows
        if: runner.os == 'Windows'
        run: python3 scripts/gui-smoke.py --executable target/${{ matrix.target }}/release/ccl-gui.exe --output dist/gui-smoke-${{ matrix.target }}.json
      - name: Verify rendered GUI readiness on macOS
        if: runner.os == 'macOS'
        run: python3 scripts/gui-smoke.py --executable target/${{ matrix.target }}/release/bundle/macos/CialloCraftLauncher.app/Contents/MacOS/ccl-gui --output dist/gui-smoke-${{ matrix.target }}.json
      - name: Normalize GUI release bundles
        run: python3 scripts/package-gui-release.py --target ${{ matrix.target }} --bundle-root target/${{ matrix.target }}/release/bundle --dist dist
      - name: Assemble ZIP and checksum
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE_EXT: zip
        run: bash scripts/package-preview.sh
      - name: Assemble ZIP and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/package-preview.ps1
      - name: Confirm packaged executable reports its Cargo version
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/ccl"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          output="$("$binary" --version)"
          test "$output" = "ccl $VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: ccl-release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified developer build
    needs: validate-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: ccl-release-*
          path: dist
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.12.4
      - name: Verify dev tip and construct immutable release identity
        id: release
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          echo "tag=dev-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          version="$(python3 scripts/check-package-versions.py --cli-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          gui_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/ccl-gui/Cargo.toml", "rb"))["package"]["version"])')"
          echo "gui_version=$gui_version" >> "$GITHUB_OUTPUT"
      - name: Build per-platform updater manifests
        env:
          CCL_BUILD_CHANNEL: dev
          CCL_BUILD_BRANCH: dev
          CCL_BUILD_COMMIT: ${{ github.sha }}
          CCL_BUILD_VERSION: ${{ steps.release.outputs.version }}
          CCL_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GUI_BUILD_VERSION: ${{ steps.release.outputs.gui_version }}
        run: |
          python3 scripts/check-package-versions.py --expected "$CCL_BUILD_VERSION"
          python3 - <<'PY'
          import os, subprocess
          targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
          for target in targets:
              subprocess.run(["python3", "scripts/release-manifest.py", "--target", target,
                              "--archive", f"dist/ccl-{target}.zip"], check=True, env=os.environ)
              gui_format = {"x86_64-pc-windows-msvc": "exe", "aarch64-apple-darwin": "app.tar.gz", "x86_64-unknown-linux-gnu": "AppImage"}[target]
              gui_env = dict(os.environ, CCL_BUILD_VERSION=os.environ["GUI_BUILD_VERSION"])
              subprocess.run(["python3", "scripts/gui-release-manifest.py", "--target", target,
                              "--asset", f"dist/ccl-gui-{target}.{gui_format}"], check=True, env=gui_env)
          PY
      - name: Sign CLI and GUI manifests with the Tauri updater key
        env:
          CCL_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.CCL_UPDATE_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.CCL_UPDATE_SIGNING_PRIVATE_KEY_PASSWORD }}
          CLI_BUILD_VERSION: ${{ steps.release.outputs.version }}
          GUI_BUILD_VERSION: ${{ steps.release.outputs.gui_version }}
        run: |
          test -n "$CCL_UPDATE_SIGNING_PRIVATE_KEY"
          export TAURI_SIGNING_PRIVATE_KEY="$CCL_UPDATE_SIGNING_PRIVATE_KEY"
          for manifest in dist/manifest-*.json; do
            tauri signer sign --app-version "$CLI_BUILD_VERSION" "$manifest"
          done
          for manifest in dist/gui-manifest-*.json; do
            tauri signer sign --app-version "$GUI_BUILD_VERSION" "$manifest"
          done
      - name: Create, verify, publish, and retain the latest ten developer releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          GUI_RELEASE_VERSION: ${{ steps.release.outputs.gui_version }}
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          test "$(find dist -maxdepth 1 -name '*.zip' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name 'manifest-*.json' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name 'manifest-*.json.sig' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name 'gui-manifest-*.json' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -name 'gui-manifest-*.json.sig' | wc -l)" -eq 3
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable release $RELEASE_TAG" >&2
            exit 1
          fi
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
          cleanup_draft() { gh release delete "$RELEASE_TAG" --yes --cleanup-tag >/dev/null 2>&1 || git push origin --delete "$RELEASE_TAG" >/dev/null 2>&1 || true; }
          trap cleanup_draft ERR
          gh release create "$RELEASE_TAG" --draft dist/*.zip dist/*.sha256 dist/manifest-*.json dist/manifest-*.json.sig dist/ccl-gui-*.dmg dist/ccl-gui-*.exe dist/ccl-gui-*.AppImage dist/ccl-gui-*.deb dist/ccl-gui-*.app.tar.gz dist/gui-manifest-*.json dist/gui-manifest-*.json.sig \
            --verify-tag --prerelease --title "CCL ${RELEASE_VERSION} dev ${GITHUB_SHA}" \
            --notes "OS-unsigned developer packages from dev commit ${GITHUB_SHA}. CLI and GUI updater manifests are signed with the release key. All three target builds passed validation."
          mkdir -p verify
          gh release download "$RELEASE_TAG" --dir verify
          (cd verify && sha256sum -c *.sha256)
          sudo apt-get update && sudo apt-get install -y minisign
          base64 --decode crates/ccl-core/src/update-public-key.pub > verify/update-public-key.minisign
          for manifest in verify/manifest-*.json verify/gui-manifest-*.json; do
            signature="$manifest.sig"
            decoded="${signature}.minisig"
            base64 --decode "$signature" > "$decoded"
            minisign -Vm "$manifest" -x "$decoded" -p verify/update-public-key.minisign
            rm "$decoded"
          done
          python3 - <<'PY'
          import base64, json, pathlib
          root = pathlib.Path("verify")
          for manifest_path in root.glob("manifest-*.json"):
              manifest = json.loads(manifest_path.read_text())
              encoded = (root / (manifest_path.name + ".sig")).read_text(encoding="ascii").strip()
              signature = base64.b64decode(encoded, validate=True).decode("ascii")
              comments = [line.removeprefix("trusted comment: ") for line in signature.splitlines()
                          if line.startswith("trusted comment: ")]
              versions = [field.removeprefix("version:") for comment in comments
                          for field in comment.split("\t") if field.startswith("version:")]
              if len(comments) != 1 or versions != [manifest["version"]]:
                  raise SystemExit(f"CLI manifest signature version mismatch: {manifest_path.name}")
          PY
          python3 scripts/verify-gui-release.py --directory verify --channel dev \
            --version "$GUI_RELEASE_VERSION" --commit "$GITHUB_SHA" --branch dev --tag "$RELEASE_TAG"
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path("verify")
          manifests = list(root.glob("manifest-*.json"))
          archives = list(root.glob("ccl-*.zip"))
          assert len(manifests) == 3 and len(archives) == 3
          for path in manifests:
              manifest = json.loads(path.read_text())
              archive = root / manifest["asset"]["name"]
              data = archive.read_bytes()
              assert len(data) == manifest["asset"]["size"]
              assert hashlib.sha256(data).hexdigest() == manifest["asset"]["sha256"]
              target = manifest["target"]
              binary = "ccl.exe" if "windows" in target else "ccl"
              executable = zipfile.ZipFile(archive).read(f"ccl-{target}/{binary}")
              assert len(executable) == manifest["executable_size"]
              assert hashlib.sha256(executable).hexdigest() == manifest["executable_sha256"]
              assert manifest["product"] == "ccl-cli"
              assert manifest["commit"] == "${{ github.sha }}"
              assert manifest["channel"] == "dev" and manifest["branch"] == "dev"
          PY
          git fetch origin dev
          if test "$(git rev-parse origin/dev)" != "$GITHUB_SHA"; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
            trap - ERR
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
          trap - ERR
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease) | select(.tagName | test("^dev-[0-9a-f]{40}$"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while IFS= read -r old_tag; do
                test -z "$old_tag" || gh release delete "$old_tag" --cleanup-tag --yes
              done
