[workspace]
members = ["crates/ccl-core", "crates/ccl-cli", "crates/ccl-gui"]
default-members = ["crates/ccl-core", "crates/ccl-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/WinstonMeursault/CialloCraftLauncher"

[workspace.dependencies]
base64 = "0.22"
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
clap = { version = "4.6", features = ["derive"] }
md5 = { package = "md-5", version = "0.10" }
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
minisign = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "9.0", default-features = false, features = ["deflate"] }
